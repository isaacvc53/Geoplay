services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # La conexión se construye por piezas (database/connection.py), así la
      # contraseña puede llevar cualquier carácter (@, /, #...).
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env (mínimo 32 caracteres)}
      # Emails (separados por comas) que pueden crear/editar/borrar países y regiones.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      # El build del frontend, solo lectura. El backend lee de ahí
      # data/available-countries.json para sortear, en las partidas 1 contra 1,
      # solo países que el frontend sabe dibujar. Si no lo encuentra, sortea entre
      # todos los países con regiones y deja un aviso en el log.
      - ./frontend/dist:/frontend-dist:ro
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  pgdata:
