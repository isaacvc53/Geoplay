<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f30">
<title>Geotaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/global.css?v=3">
<link rel="stylesheet" href="../css/game.css?v=3">
</head>
<body>
<div class="page">
  <header class="game-header">
    <a href="mapa-mundial.html" id="back-to-world" class="back-btn">
      <span class="arrow" aria-hidden="true">←</span>
      <span id="back-label">World map</span>
    </a>
    <div class="header-text">
      <p class="kicker" id="kicker">Geotaria</p>
      <h1 id="title">Loading…</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
  </header>

  <section class="game">
    <div class="toolbar">
      <div class="progress"><span id="count">0</span> / <span id="total">…</span></div>
      <div class="input-wrap">
        <input id="guess" type="text" placeholder="Type a region…" autocomplete="off" autofocus disabled>
        <button id="submit" disabled>Check</button>
      </div>
      <div id="timer" class="timer">00:00</div>
      <button id="pause" class="secondary" type="button">Pause</button>
    </div>

    <div class="map-area" id="map-area">
      <svg id="map" viewBox="0 0 960 620" aria-label="Map">
        <g class="regions"></g>
      </svg>
      <div class="map-tools">
        <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="reset-view" type="button" title="Reset view" aria-label="Reset view">⤢</button>
      </div>
      <div class="hint">Drag the map · scroll to zoom</div>
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner" aria-hidden="true"></div>
        <span id="loading-text">Loading the map…</span>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="bottom">
      <div class="left-actions">
        <button id="missing" class="secondary regions-btn" type="button">My regions</button>
        <button id="give-up" class="secondary" type="button">Give up</button>
      </div>
      <div class="right-actions">
        <button id="reset" class="secondary" type="button">Restart</button>
      </div>
    </div>

    <div class="found-scrim" id="found-scrim"></div>
    <div class="found-drawer" id="found-list-wrap">
      <div class="found-drawer-handle">
        <span id="found-drawer-title">My regions</span>
        <button type="button" class="icon-btn" id="found-drawer-close" aria-label="Close">✕</button>
      </div>
      <div class="found-list" id="found-list"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/text-match.js"></script>
<script>
  // Template bootstrap: reads ?pais=spain from the URL, dynamically loads
  // data/countries/<country>.js and, once ready, fills in the page's
  // text and starts js/game.js.
  // This is what lets country.html serve ANY country
  // (see the architecture document).
  const params = new URLSearchParams(location.search);
  const pais = params.get("pais") || "spain";

  const dataScript = document.createElement("script");
  // ?v=... stops the browser from reusing an old cached copy of this
  // script (e.g. from before the country existed, or before the latest
  // content change).
  dataScript.src = `../data/countries/${pais}.js?v=${Date.now()}`;
  dataScript.onload = () => {
    const c = window.GEOTARIA_COUNTRY;
    if (!c) {
      document.getElementById("title").textContent = "Country not found";
      return;
    }
    document.getElementById("kicker").textContent = c.kicker || "Geotaria";
    document.getElementById("title").textContent = c.title || "";
    document.getElementById("subtitle").textContent = c.subtitle || "";
    document.getElementById("guess").placeholder = c.guessPlaceholder || "";
    document.getElementById("submit").textContent = c.submitLabel || "Check";
    document.getElementById("pause").textContent = c.pauseLabel || "Pause";
    document.getElementById("missing").textContent = c.missingLabel || "My regions";
    document.getElementById("give-up").textContent = c.giveUpLabel || "Give up";
    document.getElementById("reset").textContent = c.resetLabel || "Restart";
    document.querySelector(".hint").textContent = c.hintText || "";
    document.getElementById("loading-text").textContent = `Loading the map of ${c.title || pais}…`;

    const backLabel = document.getElementById("back-label");
    if (backLabel && c.backLabel) backLabel.textContent = c.backLabel;

    const foundDrawerTitle = document.getElementById("found-drawer-title");
    if (foundDrawerTitle) foundDrawerTitle.textContent = c.missingLabel || "My regions";

    const gameScript = document.createElement("script");
    // Same reason as the ?v=... above: without this, the browser (or a
    // CDN in front of it) could keep serving an old cached copy of
    // game.js indefinitely, even after a new file is uploaded to the
    // server.
    gameScript.src = `../js/game.js?v=${Date.now()}`;
    document.body.appendChild(gameScript);
  };
  dataScript.onerror = () => {
    document.getElementById("title").textContent = "Country not found";
    const loadingText = document.getElementById("loading-text");
    if (loadingText) loadingText.textContent = `data/countries/${pais}.js does not exist`;
    const overlay = document.getElementById("loading-overlay");
    if (overlay) overlay.classList.add("error");
  };
  document.body.appendChild(dataScript);
</script>
</body>
</html>
