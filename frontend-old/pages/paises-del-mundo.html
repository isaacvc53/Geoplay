<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas World — Los 197 países</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean-deep:#0b1c2c;
    --ocean-mid:#123049;
    --paper:#f6f1e4;
    --ink:#0e2233;
    --ink-soft:#6b6250;
    --brass:#c9a24b;
    --brass-bright:#e6c273;
    --brass-dim:#8a774a;
    --hairline:rgba(201,162,75,0.22);
    --shadow:rgba(4,10,16,0.5);
    --found:#7fae6a;
    --miss:#b3564c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:radial-gradient(ellipse at 28% 6%, var(--ocean-mid) 0%, var(--ocean-deep) 62%);
    font-family:'Space Mono',monospace;
    color:var(--paper);
  }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--brass-bright); outline-offset:3px; }

  header{ padding:36px 40px 20px 40px; max-width:1000px; margin:0 auto; }
  .btn-back{
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 14px; margin-bottom:22px;
    border:1px solid var(--brass-dim); background:transparent; color:var(--paper);
    font-size:12px; letter-spacing:0.04em; text-decoration:none;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .btn-back:hover{ border-color:var(--brass); color:var(--brass-bright); }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,4vw,40px); margin:0 0 6px 0; }
  .subtitle{ font-size:12.5px; color:var(--brass-dim); letter-spacing:0.03em; margin:0; }

  main{ max-width:1000px; margin:0 auto; padding:10px 40px 70px 40px; }

  .panel{
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
    background:rgba(246,241,228,0.05);
    border:1px solid var(--hairline);
    padding:20px 22px;
    margin-bottom:26px;
  }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat .num{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--brass-bright); }
  .stat .lbl{ font-size:10.5px; color:var(--brass-dim); letter-spacing:0.04em; }

  .bar-track{ flex:1 1 160px; min-width:140px; height:6px; background:rgba(246,241,228,0.12); position:relative; }
  .bar-fill{ height:100%; background:var(--brass); width:0%; transition:width 0.25s ease; }

  form{ display:flex; gap:10px; margin-bottom:10px; }
  input[type="text"]{
    flex:1;
    font-family:'Space Mono',monospace;
    font-size:15px;
    padding:13px 16px;
    background:var(--paper);
    color:var(--ink);
    border:1px solid var(--hairline);
  }
  input[type="text"]:focus{ outline:2px solid var(--brass-bright); outline-offset:2px; }
  button.submit{
    font-family:'Space Mono',monospace;
    font-size:13px;
    padding:0 22px;
    background:var(--brass);
    color:var(--ink);
    border:none;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  button.submit:hover{ background:var(--brass-bright); }

  .feedback{
    min-height:20px;
    font-size:12.5px;
    margin-bottom:26px;
    color:rgba(246,241,228,0.55);
  }
  .feedback.ok{ color:var(--found); }
  .feedback.bad{ color:var(--miss); }

  .continente{ margin-bottom:30px; }
  .continente h2{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 12px 0;
    padding-bottom:8px;
    border-bottom:1px solid var(--hairline);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .continente h2 .c-count{ font-size:11px; color:var(--brass-dim); }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px;
    padding:6px 10px;
    border:1px solid var(--hairline);
    background:rgba(246,241,228,0.04);
    color:rgba(246,241,228,0.25);
    letter-spacing:0.02em;
  }
  .chip.found{
    background:var(--paper);
    color:var(--ink);
    border-color:var(--paper);
    animation:pop 0.28s ease;
  }
  .chip .bandera{
    width:14px; height:10px; flex:none;
    object-fit:cover;
    border:1px solid rgba(14,34,51,0.25);
  }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0.4; } to{ transform:scale(1); opacity:1; } }
  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .win{
    display:none;
    margin-top:20px;
    padding:22px;
    border:1px solid var(--brass);
    background:rgba(201,162,75,0.08);
    text-align:center;
  }
  .win.show{ display:block; }
  .win h2{ font-family:'Fraunces',serif; font-size:22px; margin:0 0 6px 0; color:var(--brass-bright); }
  .win p{ font-size:12.5px; color:rgba(246,241,228,0.7); margin:0; }
  .btn-again{
    margin-top:18px;
    font-family:'Space Mono',monospace;
    font-size:12.5px;
    padding:10px 22px;
    background:transparent;
    color:var(--brass-bright);
    border:1px solid var(--brass);
    cursor:pointer;
    letter-spacing:0.04em;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .btn-again:hover{ background:var(--brass); color:var(--ink); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; }
  }
  @media (max-width:640px){
    header, main{ padding-left:20px; padding-right:20px; }
  }
</style>
</head>
<body>

<header>
  <a class="btn-back" href="seleccionar-modo.html"><span>←</span> Elegir modo</a>
  <h1>Los 197 países</h1>
  <p class="subtitle">Escribe de memoria todos los países del mundo, uno por uno</p>
</header>

<main>
  <div class="panel">
    <div class="stat"><span class="num" id="contador">0 / 197</span><span class="lbl">encontrados</span></div>
    <div class="stat"><span class="num" id="tiempo">00:00</span><span class="lbl">tiempo</span></div>
    <div class="bar-track"><div class="bar-fill" id="barra"></div></div>
  </div>

  <form id="form">
    <label for="entrada" class="visually-hidden">Escribe el nombre de un país</label>
    <input type="text" id="entrada" placeholder="Escribe un país y pulsa Intro…" autocomplete="off" autofocus>
    <button class="submit" type="submit">Añadir</button>
  </form>
  <div class="feedback" id="feedback" aria-live="polite"></div>

  <div id="continentes"></div>

  <div class="win" id="win">
    <h2>Los 197, completos</h2>
    <p id="win-tiempo"></p>
    <button class="btn-again" id="btn-again" type="button">Jugar de nuevo</button>
  </div>
</main>

<script>
  const CONTINENTES = {
    europa: { nombre: "Europa", paises: ["Albania","Alemania","Andorra","Austria","Bélgica","Bielorrusia","Bosnia y Herzegovina","Bulgaria","Chipre","Croacia","Dinamarca","Eslovaquia","Eslovenia","España","Estonia","Finlandia","Francia","Grecia","Hungría","Irlanda","Islandia","Italia","Kosovo","Letonia","Liechtenstein","Lituania","Luxemburgo","Macedonia del Norte","Malta","Moldavia","Mónaco","Montenegro","Noruega","Países Bajos","Polonia","Portugal","Reino Unido","República Checa","Rumanía","Rusia","San Marino","Serbia","Suecia","Suiza","Ucrania","Vaticano"] },
    asia: { nombre: "Asia", paises: ["Afganistán","Arabia Saudita","Armenia","Azerbaiyán","Baréin","Bangladés","Bután","Brunéi","Camboya","Catar","China","Corea del Norte","Corea del Sur","Emiratos Árabes Unidos","Filipinas","Georgia","India","Indonesia","Irak","Irán","Israel","Japón","Jordania","Kazajistán","Kirguistán","Kuwait","Laos","Líbano","Malasia","Maldivas","Mongolia","Myanmar","Nepal","Omán","Pakistán","Palestina","Singapur","Siria","Sri Lanka","Tailandia","Taiwán","Tayikistán","Timor Oriental","Turkmenistán","Turquía","Uzbekistán","Vietnam","Yemen"] },
    africa: { nombre: "África", paises: ["Angola","Argelia","Benín","Botsuana","Burkina Faso","Burundi","Cabo Verde","Camerún","Chad","Comoras","Costa de Marfil","Egipto","Eritrea","Esuatini","Etiopía","Gabón","Gambia","Ghana","Guinea","Guinea-Bisáu","Guinea Ecuatorial","Kenia","Lesoto","Liberia","Libia","Madagascar","Malaui","Malí","Marruecos","Mauricio","Mauritania","Mozambique","Namibia","Níger","Nigeria","República Centroafricana","República del Congo","República Democrática del Congo","Ruanda","Santo Tomé y Príncipe","Senegal","Seychelles","Sierra Leona","Somalia","Sudáfrica","Sudán","Sudán del Sur","Tanzania","Togo","Túnez","Uganda","Yibuti","Zambia","Zimbabue"] },
    america: { nombre: "América", paises: ["Antigua y Barbuda","Argentina","Bahamas","Barbados","Belice","Bolivia","Brasil","Canadá","Chile","Colombia","Costa Rica","Cuba","Dominica","Ecuador","El Salvador","Estados Unidos","Granada","Guatemala","Guyana","Haití","Honduras","Jamaica","México","Nicaragua","Panamá","Paraguay","Perú","República Dominicana","San Cristóbal y Nieves","San Vicente y las Granadinas","Santa Lucía","Surinam","Trinidad y Tobago","Uruguay","Venezuela"] },
    oceania: { nombre: "Oceanía", paises: ["Australia","Fiyi","Islas Marshall","Islas Salomón","Kiribati","Micronesia","Nauru","Nueva Zelanda","Palaos","Papúa Nueva Guinea","Samoa","Tonga","Tuvalu","Vanuatu"] }
  };

  // Alias comunes -> nombre exacto tal y como aparece en las listas de arriba.
  // Importante: las claves deben escribirse ya SIN tildes/ñ, porque lo que se
  // compara aquí (candidato) ha pasado por normalizar() y nunca lleva acentos.
  const ALIAS = {
    "eeuu":"estados unidos", "usa":"estados unidos", "ee uu":"estados unidos",
    "uk":"reino unido", "gran bretana":"reino unido", "inglaterra":"reino unido",
    "holanda":"paises bajos",
    "chequia":"republica checa",
    "birmania":"myanmar",
    "suazilandia":"esuatini", "swazilandia":"esuatini",
    "macedonia":"macedonia del norte",
    "emiratos":"emiratos arabes unidos", "emiratos arabes":"emiratos arabes unidos",
    "congo brazzaville":"republica del congo",
    "congo kinshasa":"republica democratica del congo", "rd congo":"republica democratica del congo", "rdc":"republica democratica del congo",
    "timor este":"timor oriental", "timor leste":"timor oriental",
    "bosnia":"bosnia y herzegovina",
    "santa sede":"vaticano",
    "corea sur":"corea del sur",
    "corea norte":"corea del norte"
  };

  // Código ISO-2 de cada país (mismo criterio de normalización que arriba),
  // usado solo para mostrar una pequeña bandera junto a los países acertados.
  const ISO_POR_PAIS = {
    "albania":"al","alemania":"de","andorra":"ad","austria":"at","belgica":"be","bielorrusia":"by",
    "bosnia y herzegovina":"ba","bulgaria":"bg","chipre":"cy","croacia":"hr","dinamarca":"dk","eslovaquia":"sk",
    "eslovenia":"si","espana":"es","estonia":"ee","finlandia":"fi","francia":"fr","grecia":"gr","hungria":"hu",
    "irlanda":"ie","islandia":"is","italia":"it","kosovo":"xk","letonia":"lv","liechtenstein":"li","lituania":"lt",
    "luxemburgo":"lu","macedonia del norte":"mk","malta":"mt","moldavia":"md","monaco":"mc","montenegro":"me",
    "noruega":"no","paises bajos":"nl","polonia":"pl","portugal":"pt","reino unido":"gb","republica checa":"cz",
    "rumania":"ro","rusia":"ru","san marino":"sm","serbia":"rs","suecia":"se","suiza":"ch","ucrania":"ua",
    "vaticano":"va","afganistan":"af","arabia saudita":"sa","armenia":"am","azerbaiyan":"az","barein":"bh",
    "banglades":"bd","butan":"bt","brunei":"bn","camboya":"kh","catar":"qa","china":"cn","corea del norte":"kp",
    "corea del sur":"kr","emiratos arabes unidos":"ae","filipinas":"ph","georgia":"ge","india":"in","indonesia":"id",
    "irak":"iq","iran":"ir","israel":"il","japon":"jp","jordania":"jo","kazajistan":"kz","kirguistan":"kg",
    "kuwait":"kw","laos":"la","libano":"lb","malasia":"my","maldivas":"mv","mongolia":"mn","myanmar":"mm",
    "nepal":"np","oman":"om","pakistan":"pk","palestina":"ps","singapur":"sg","siria":"sy","sri lanka":"lk",
    "tailandia":"th","taiwan":"tw","tayikistan":"tj","timor oriental":"tl","turkmenistan":"tm","turquia":"tr",
    "uzbekistan":"uz","vietnam":"vn","yemen":"ye","angola":"ao","argelia":"dz","benin":"bj","botsuana":"bw",
    "burkina faso":"bf","burundi":"bi","cabo verde":"cv","camerun":"cm","chad":"td","comoras":"km",
    "costa de marfil":"ci","egipto":"eg","eritrea":"er","esuatini":"sz","etiopia":"et","gabon":"ga","gambia":"gm",
    "ghana":"gh","guinea":"gn","guineabisau":"gw","guinea ecuatorial":"gq","kenia":"ke","lesoto":"ls","liberia":"lr",
    "libia":"ly","madagascar":"mg","malaui":"mw","mali":"ml","marruecos":"ma","mauricio":"mu","mauritania":"mr",
    "mozambique":"mz","namibia":"na","niger":"ne","nigeria":"ng","republica centroafricana":"cf",
    "republica del congo":"cg","republica democratica del congo":"cd","ruanda":"rw","santo tome y principe":"st",
    "senegal":"sn","seychelles":"sc","sierra leona":"sl","somalia":"so","sudafrica":"za","sudan":"sd",
    "sudan del sur":"ss","tanzania":"tz","togo":"tg","tunez":"tn","uganda":"ug","yibuti":"dj","zambia":"zm",
    "zimbabue":"zw","antigua y barbuda":"ag","argentina":"ar","bahamas":"bs","barbados":"bb","belice":"bz",
    "bolivia":"bo","brasil":"br","canada":"ca","chile":"cl","colombia":"co","costa rica":"cr","cuba":"cu",
    "dominica":"dm","ecuador":"ec","el salvador":"sv","estados unidos":"us","granada":"gd","guatemala":"gt",
    "guyana":"gy","haiti":"ht","honduras":"hn","jamaica":"jm","mexico":"mx","nicaragua":"ni","panama":"pa",
    "paraguay":"py","peru":"pe","republica dominicana":"do","san cristobal y nieves":"kn",
    "san vicente y las granadinas":"vc","santa lucia":"lc","surinam":"sr","trinidad y tobago":"tt","uruguay":"uy",
    "venezuela":"ve","australia":"au","fiyi":"fj","islas marshall":"mh","islas salomon":"sb","kiribati":"ki",
    "micronesia":"fm","nauru":"nr","nueva zelanda":"nz","palaos":"pw","papua nueva guinea":"pg","samoa":"ws",
    "tonga":"to","tuvalu":"tv","vanuatu":"vu"
  };

  function normalizar(str){
    return str
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9\s]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  // Lista plana con nombre normalizado -> {nombre real, continente}
  const TODOS = [];
  Object.entries(CONTINENTES).forEach(([key, c]) => {
    c.paises.forEach(pais => {
      TODOS.push({ nombre: pais, norm: normalizar(pais), continente: key, encontrado: false });
    });
  });
  const TOTAL = TODOS.length; // 197

  const contadorEl = document.getElementById("contador");
  const barraEl = document.getElementById("barra");
  const tiempoEl = document.getElementById("tiempo");
  const feedbackEl = document.getElementById("feedback");
  const contenedor = document.getElementById("continentes");
  const winEl = document.getElementById("win");

  // Construir el HTML de cada continente
  Object.entries(CONTINENTES).forEach(([key, c]) => {
    const section = document.createElement("div");
    section.className = "continente";
    section.innerHTML = `
      <h2>${c.nombre} <span class="c-count" id="count-${key}">0 / ${c.paises.length}</span></h2>
      <div class="chips" id="chips-${key}"></div>
    `;
    contenedor.appendChild(section);
    const chipsWrap = section.querySelector(`#chips-${key}`);
    [...c.paises].sort((a,b) => a.localeCompare(b,"es")).forEach(pais => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.dataset.norm = normalizar(pais);
      chip.textContent = "?????";
      chipsWrap.appendChild(chip);
    });
  });

  let encontrados = 0;
  let empezado = false;
  let segundos = 0;
  let timerId = null;

  function actualizarTiempo(){
    segundos++;
    const m = String(Math.floor(segundos/60)).padStart(2,"0");
    const s = String(segundos%60).padStart(2,"0");
    tiempoEl.textContent = `${m}:${s}`;
  }

  function marcarEncontrado(pais){
    pais.encontrado = true;
    encontrados++;
    contadorEl.textContent = `${encontrados} / ${TOTAL}`;
    barraEl.style.width = `${(encontrados/TOTAL)*100}%`;

    const chip = document.querySelector(`.chip[data-norm="${CSS.escape(pais.norm)}"]`);
    if(chip){
      chip.textContent = "";
      chip.classList.add("found");
      const iso = ISO_POR_PAIS[pais.norm];
      if(iso){
        const bandera = document.createElement("img");
        bandera.className = "bandera";
        bandera.loading = "lazy";
        bandera.alt = "";
        bandera.src = `https://flagcdn.com/${iso}.svg`;
        bandera.onerror = () => bandera.remove();
        chip.appendChild(bandera);
      }
      chip.appendChild(document.createTextNode(pais.nombre));
    }
    const contKey = pais.continente;
    const encontradosContinente = TODOS.filter(p => p.continente === contKey && p.encontrado).length;
    document.getElementById(`count-${contKey}`).textContent = `${encontradosContinente} / ${CONTINENTES[contKey].paises.length}`;

    if(encontrados === TOTAL){
      clearInterval(timerId);
      document.getElementById("win-tiempo").textContent = `Lo has conseguido en ${tiempoEl.textContent}.`;
      winEl.classList.add("show");
    }
  }

  function feedback(msg, tipo){
    feedbackEl.textContent = msg;
    feedbackEl.className = "feedback" + (tipo ? " " + tipo : "");
  }

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const entrada = document.getElementById("entrada");
    const valor = entrada.value;
    entrada.value = "";
    if(!valor.trim()) return;

    if(!empezado){
      empezado = true;
      timerId = setInterval(actualizarTiempo, 1000);
    }

    let candidato = normalizar(valor);
    if(ALIAS[candidato]) candidato = ALIAS[candidato];

    const pais = TODOS.find(p => p.norm === candidato);

    if(!pais){
      feedback(`No reconozco "${valor.trim()}".`, "bad");
    } else if(pais.encontrado){
      feedback(`Ya tenías ${pais.nombre}.`, "");
    } else {
      marcarEncontrado(pais);
      feedback(`${pais.nombre} — ${TOTAL - encontrados} por descubrir.`, "ok");
    }
  });

  document.getElementById("btn-again").addEventListener("click", () => location.reload());
</script>

</body>
</html>
