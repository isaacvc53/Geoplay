<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas World — Countries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean-deep:#0b1c2c;
    --ocean-mid:#123049;
    --paper:#f6f1e4;
    --land-hover:#f3c667;
    --ink:#0e2233;
    --ink-soft:#6b6250;
    --brass:#c9a24b;
    --brass-bright:#e6c273;
    --brass-dim:#8a774a;
    --hairline:rgba(201,162,75,0.22);
    --shadow:rgba(4,10,16,0.5);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:radial-gradient(ellipse at 28% 6%, var(--ocean-mid) 0%, var(--ocean-deep) 62%);
    font-family:'Space Mono',monospace;
    color:var(--paper);
  }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--brass-bright); outline-offset:3px; }

  header{ padding:36px 40px 26px 40px; max-width:1120px; margin:0 auto; border-bottom:1px solid var(--hairline); }
  .btn-back{
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 14px; margin-bottom:22px;
    border:1px solid var(--brass-dim); background:transparent; color:var(--paper);
    font-size:12px; letter-spacing:0.04em; text-decoration:none;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .btn-back:hover{ border-color:var(--brass); color:var(--brass-bright); }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,4vw,40px); margin:0 0 6px 0; }
  .subtitle{ font-size:12.5px; color:var(--brass-dim); letter-spacing:0.03em; margin:0; }

  main{ max-width:1120px; margin:0 auto; padding:26px 40px 70px 40px; }

  .panel{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    background:rgba(246,241,228,0.05);
    border:1px solid var(--hairline);
    padding:16px 20px;
    margin-bottom:28px;
  }
  .stat{ display:flex; flex-direction:column; gap:2px; white-space:nowrap; }
  .stat .num{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--brass-bright); }
  .stat .lbl{ font-size:10px; color:var(--brass-dim); letter-spacing:0.04em; }
  .search-wrap{ flex:1 1 200px; min-width:180px; }
  #search{
    width:100%;
    font-family:'Space Mono',monospace;
    font-size:14px;
    padding:11px 14px;
    background:var(--paper);
    color:var(--ink);
    border:1px solid var(--hairline);
  }
  #search:focus{ outline:2px solid var(--brass-bright); outline-offset:2px; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(172px, 1fr));
    gap:16px;
  }
  .tile{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:24px 14px 16px 14px;
    text-decoration:none;
    background:var(--paper);
    border:1px solid var(--hairline);
    box-shadow:0 10px 22px var(--shadow);
    transition:transform 0.18s cubic-bezier(.16,.84,.32,1), box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .tile:hover, .tile:focus-visible{
    transform:translateY(-4px);
    border-color:var(--brass);
    box-shadow:0 18px 34px var(--shadow);
  }
  .tile .flag{
    position:absolute; top:-8px; right:12px;
    width:34px; height:24px;
    object-fit:cover;
    background:#fff;
    border:1px solid rgba(14,34,51,0.18);
    box-shadow:0 3px 8px rgba(4,10,16,0.35);
    transform:rotate(3deg);
    transition:transform 0.18s ease;
  }
  .tile:hover .flag{ transform:rotate(0deg) scale(1.05); }
  .silhouette-wrap{
    width:100%; height:78px;
    display:flex; align-items:center; justify-content:center;
  }
  .silhouette{
    max-width:100%; max-height:100%;
    filter:grayscale(1) opacity(0.8);
    transition:filter 0.18s ease, transform 0.18s ease;
  }
  .silhouette.fallback{ width:30px; height:30px; opacity:0.55; }
  .tile:hover .silhouette{ filter:grayscale(0.3) opacity(1); transform:scale(1.04); }
  .t-name{
    font-family:'Fraunces',serif; font-weight:600; font-size:14px; line-height:1.25;
    color:var(--ink); text-align:center;
  }

  .empty{ font-size:13px; color:rgba(246,241,228,0.6); line-height:1.7; }
  .empty a{ color:var(--brass-bright); }
  .no-results{ display:none; font-size:12.5px; color:rgba(246,241,228,0.55); padding:20px 0; }
</style>
</head>
<body>

<header>
  <a class="btn-back" href="seleccionar-modo.html"><span>←</span> Choose mode</a>
  <h1 id="title">Countries</h1>
  <p class="subtitle" id="subtitle">Choose a country to explore</p>
</header>

<main>
  <div class="panel" id="panel" style="display:none;">
    <div class="stat"><span class="num" id="counter">0</span><span class="lbl">countries</span></div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search country…" autocomplete="off">
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <p class="no-results" id="no-results">No country matches your search.</p>
  <div class="empty" id="empty" style="display:none;"></div>
</main>

<script>
  // Path to each country's silhouette SVG (English file names, e.g. "albania.svg").
  // Adjust this prefix depending on where this file sits relative to data/geo.
  const GEO_PATH = "../data/geo/";

  // [English display name, English silhouette filename, ISO-2 code for the flag, original Spanish name used to build the country.html link]
  const CONTINENTS = {
    europa: { name:"Europe", countries:[

      ["Bosnia and Herzegovina","bosnia-and-herzegovina","ba","Bosnia y Herzegovina"],["Bulgaria","bulgaria","bg","Bulgaria"],
      ["Cyprus","cyprus","cy","Chipre"],["Croatia","croatia","hr","Croacia"],["Denmark","denmark","dk","Dinamarca"],
      ["Slovakia","slovakia","sk","Eslovaquia"],["Slovenia","slovenia","si","Eslovenia"],["Spain","spain","es","España"],
      ["Estonia","estonia","ee","Estonia"],["Finland","finland","fi","Finlandia"],["France","france","fr","Francia"],
      ["Greece","greece","gr","Grecia"],["Hungary","hungary","hu","Hungría"],["Ireland","ireland","ie","Irlanda"],
      ["Iceland","iceland","is","Islandia"],["Italy","italy","it","Italia"],["Kosovo","kosovo","xk","Kosovo"],
      ["Latvia","latvia","lv","Letonia"],["Liechtenstein","liechtenstein","li","Liechtenstein"],["Lithuania","lithuania","lt","Lituania"],
      ["Luxembourg","luxembourg","lu","Luxemburgo"],["North Macedonia","north-macedonia","mk","Macedonia del Norte"],["Malta","malta","mt","Malta"],
      ["Moldova","moldova","md","Moldavia"],["Monaco","monaco","mc","Mónaco"],["Montenegro","montenegro","me","Montenegro"],
      ["Norway","norway","no","Noruega"],["Netherlands","netherlands","nl","Países Bajos"],["Poland","poland","pl","Polonia"],
      ["Portugal","portugal","pt","Portugal"],["United Kingdom","united-kingdom","gb","Reino Unido"],["Czech Republic","czech-republic","cz","República Checa"],
      ["Romania","romania","ro","Rumanía"],["Russia","russia","ru","Rusia"],["San Marino","san-marino","sm","San Marino"],
      ["Serbia","serbia","rs","Serbia"],["Sweden","sweden","se","Suecia"],["Switzerland","switzerland","ch","Suiza"],
      ["Ukraine","ukraine","ua","Ucrania"],["Vatican City","vatican-city","va","Vaticano"]
    ]},
    asia: { name:"Asia", countries:[
      ["Afghanistan","afghanistan","af","Afganistán"],["Saudi Arabia","saudi-arabia","sa","Arabia Saudita"],["Armenia","armenia","am","Armenia"],
      ["Azerbaijan","azerbaijan","az","Azerbaiyán"],["Bahrain","bahrain","bh","Baréin"],["Bangladesh","bangladesh","bd","Bangladés"],
      ["Bhutan","bhutan","bt","Bután"],["Brunei","brunei","bn","Brunéi"],["Cambodia","cambodia","kh","Camboya"],
      ["Qatar","qatar","qa","Catar"],["China","china","cn","China"],["North Korea","north-korea","kp","Corea del Norte"],
      ["South Korea","south-korea","kr","Corea del Sur"],["United Arab Emirates","united-arab-emirates","ae","Emiratos Árabes Unidos"],
      ["Philippines","philippines","ph","Filipinas"],["Georgia","georgia","ge","Georgia"],["India","india","in","India"],
      ["Indonesia","indonesia","id","Indonesia"],["Iraq","iraq","iq","Irak"],["Iran","iran","ir","Irán"],
      ["Israel","israel","il","Israel"],["Japan","japan","jp","Japón"],["Jordan","jordan","jo","Jordania"],
      ["Kazakhstan","kazakhstan","kz","Kazajistán"],["Kyrgyzstan","kyrgyzstan","kg","Kirguistán"],["Kuwait","kuwait","kw","Kuwait"],
      ["Laos","laos","la","Laos"],["Lebanon","lebanon","lb","Líbano"],["Malaysia","malaysia","my","Malasia"],
      ["Maldives","maldives","mv","Maldivas"],["Mongolia","mongolia","mn","Mongolia"],["Myanmar","myanmar","mm","Myanmar"],
      ["Nepal","nepal","np","Nepal"],["Oman","oman","om","Omán"],["Pakistan","pakistan","pk","Pakistán"],
      ["Palestine","palestine","ps","Palestina"],["Singapore","singapore","sg","Singapur"],["Syria","syria","sy","Siria"],
      ["Sri Lanka","sri-lanka","lk","Sri Lanka"],["Thailand","thailand","th","Tailandia"],["Taiwan","taiwan","tw","Taiwán"],
      ["Tajikistan","tajikistan","tj","Tayikistán"],["Timor-Leste","timor-leste","tl","Timor Oriental"],["Turkmenistan","turkmenistan","tm","Turkmenistán"],
      ["Turkey","turkey","tr","Turquía"],["Uzbekistan","uzbekistan","uz","Uzbekistán"],["Vietnam","vietnam","vn","Vietnam"],["Yemen","yemen","ye","Yemen"]
    ]},
    africa: { name:"Africa", countries:[
      ["Angola","angola","ao","Angola"],["Algeria","algeria","dz","Argelia"],["Benin","benin","bj","Benín"],
      ["Botswana","botswana","bw","Botsuana"],["Burkina Faso","burkina-faso","bf","Burkina Faso"],["Burundi","burundi","bi","Burundi"],
      ["Cape Verde","cape-verde","cv","Cabo Verde"],["Cameroon","cameroon","cm","Camerún"],["Chad","chad","td","Chad"],
      ["Comoros","comoros","km","Comoras"],["Ivory Coast","ivory-coast","ci","Costa de Marfil"],["Egypt","egypt","eg","Egipto"],
      ["Eritrea","eritrea","er","Eritrea"],["Eswatini","eswatini","sz","Esuatini"],["Ethiopia","ethiopia","et","Etiopía"],
      ["Gabon","gabon","ga","Gabón"],["Gambia","gambia","gm","Gambia"],["Ghana","ghana","gh","Ghana"],
      ["Guinea","guinea","gn","Guinea"],["Guinea-Bissau","guinea-bissau","gw","Guinea-Bisáu"],["Equatorial Guinea","equatorial-guinea","gq","Guinea Ecuatorial"],
      ["Kenya","kenya","ke","Kenia"],["Lesotho","lesotho","ls","Lesoto"],["Liberia","liberia","lr","Liberia"],
      ["Libya","libya","ly","Libia"],["Madagascar","madagascar","mg","Madagascar"],["Malawi","malawi","mw","Malaui"],
      ["Mali","mali","ml","Malí"],["Morocco","morocco","ma","Marruecos"],["Mauritius","mauritius","mu","Mauricio"],
      ["Mauritania","mauritania","mr","Mauritania"],["Mozambique","mozambique","mz","Mozambique"],["Namibia","namibia","na","Namibia"],
      ["Niger","niger","ne","Níger"],["Nigeria","nigeria","ng","Nigeria"],["Central African Republic","central-african-republic","cf","República Centroafricana"],
      ["Republic of the Congo","republic-of-the-congo","cg","República del Congo"],["Democratic Republic of the Congo","democratic-republic-of-the-congo","cd","República Democrática del Congo"],
      ["Rwanda","rwanda","rw","Ruanda"],["São Tomé and Príncipe","sao-tome-and-principe","st","Santo Tomé y Príncipe"],["Senegal","senegal","sn","Senegal"],
      ["Seychelles","seychelles","sc","Seychelles"],["Sierra Leone","sierra-leone","sl","Sierra Leona"],["Somalia","somalia","so","Somalia"],
      ["South Africa","south-africa","za","Sudáfrica"],["Sudan","sudan","sd","Sudán"],["South Sudan","south-sudan","ss","Sudán del Sur"],
      ["Tanzania","tanzania","tz","Tanzania"],["Togo","togo","tg","Togo"],["Tunisia","tunisia","tn","Túnez"],
      ["Uganda","uganda","ug","Uganda"],["Djibouti","djibouti","dj","Yibuti"],["Zambia","zambia","zm","Zambia"],["Zimbabwe","zimbabwe","zw","Zimbabue"]
    ]},
    america: { name:"Americas", countries:[
      ["Antigua and Barbuda","antigua-and-barbuda","ag","Antigua y Barbuda"],["Argentina","argentina","ar","Argentina"],["Bahamas","bahamas","bs","Bahamas"],
      ["Barbados","barbados","bb","Barbados"],["Belize","belize","bz","Belice"],["Bolivia","bolivia","bo","Bolivia"],
      ["Brazil","brazil","br","Brasil"],["Canada","canada","ca","Canadá"],["Chile","chile","cl","Chile"],
      ["Colombia","colombia","co","Colombia"],["Costa Rica","costa-rica","cr","Costa Rica"],["Cuba","cuba","cu","Cuba"],
      ["Dominica","dominica","dm","Dominica"],["Ecuador","ecuador","ec","Ecuador"],["El Salvador","el-salvador","sv","El Salvador"],
      ["United States","united-states","us","Estados Unidos"],["Grenada","grenada","gd","Granada"],["Guatemala","guatemala","gt","Guatemala"],
      ["Guyana","guyana","gy","Guyana"],["Haiti","haiti","ht","Haití"],["Honduras","honduras","hn","Honduras"],
      ["Jamaica","jamaica","jm","Jamaica"],["Mexico","mexico","mx","México"],["Nicaragua","nicaragua","ni","Nicaragua"],
      ["Panama","panama","pa","Panamá"],["Paraguay","paraguay","py","Paraguay"],["Peru","peru","pe","Perú"],
      ["Dominican Republic","dominican-republic","do","República Dominicana"],["Saint Kitts and Nevis","saint-kitts-and-nevis","kn","San Cristóbal y Nieves"],
      ["Saint Vincent and the Grenadines","saint-vincent-and-the-grenadines","vc","San Vicente y las Granadinas"],["Saint Lucia","saint-lucia","lc","Santa Lucía"],
      ["Suriname","suriname","sr","Surinam"],["Trinidad and Tobago","trinidad-and-tobago","tt","Trinidad y Tobago"],["Uruguay","uruguay","uy","Uruguay"],
      ["Venezuela","venezuela","ve","Venezuela"]
    ]},
    oceania: { name:"Oceania", countries:[
      ["Australia","australia","au","Australia"],["Fiji","fiji","fj","Fiyi"],["Marshall Islands","marshall-islands","mh","Islas Marshall"],
      ["Solomon Islands","solomon-islands","sb","Islas Salomón"],["Kiribati","kiribati","ki","Kiribati"],["Micronesia","micronesia","fm","Micronesia"],
      ["Nauru","nauru","nr","Nauru"],["New Zealand","new-zealand","nz","Nueva Zelanda"],["Palau","palau","pw","Palaos"],
      ["Papua New Guinea","papua-new-guinea","pg","Papúa Nueva Guinea"],["Samoa","samoa","ws","Samoa"],["Tonga","tonga","to","Tonga"],
      ["Tuvalu","tuvalu","tv","Tuvalu"],["Vanuatu","vanuatu","vu","Vanuatu"]
    ]}
  };

  function slug(name){
    return name
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-|-$)/g, "");
  }
  function normalize(str){
    return str
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .trim();
  }

  const FALLBACK_SILHOUETTE = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#8a774a" stroke-width="1.4"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>'
  );

  const params = new URLSearchParams(location.search);
  const zoneKey = params.get("zona");
  const zone = CONTINENTS[zoneKey];

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const panel = document.getElementById("panel");
  const counterEl = document.getElementById("counter");
  const noResults = document.getElementById("no-results");

  if(zone){
    document.getElementById("title").textContent = zone.name;
    document.getElementById("subtitle").textContent = `${zone.countries.length} countries — choose one to explore`;
    document.title = `Atlas World — ${zone.name}`;
    panel.style.display = "flex";
    counterEl.textContent = zone.countries.length;

    const sorted = [...zone.countries].sort((a,b) => a[0].localeCompare(b[0], "en"));

    sorted.forEach(([nameEn, geoSlug, iso, nameEs]) => {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = `country.html?pais=${slug(nameEs)}`;
      a.dataset.norm = normalize(nameEn);

      const flag = document.createElement("img");
      flag.className = "flag";
      flag.loading = "lazy";
      flag.alt = "";
      flag.src = `https://flagcdn.com/${iso}.svg`;
      flag.onerror = () => { flag.style.display = "none"; };

      const silhouetteWrap = document.createElement("div");
      silhouetteWrap.className = "silhouette-wrap";
      const silhouette = document.createElement("img");
      silhouette.className = "silhouette";
      silhouette.loading = "lazy";
      silhouette.alt = "";
      silhouette.src = `${GEO_PATH}${geoSlug}.svg`;
      silhouette.onerror = () => {
        silhouette.onerror = null;
        silhouette.src = FALLBACK_SILHOUETTE;
        silhouette.classList.add("fallback");
      };
      silhouetteWrap.appendChild(silhouette);

      const name = document.createElement("span");
      name.className = "t-name";
      name.textContent = nameEn;

      a.appendChild(flag);
      a.appendChild(silhouetteWrap);
      a.appendChild(name);
      grid.appendChild(a);
    });

    document.getElementById("search").addEventListener("input", e => {
      const q = normalize(e.target.value);
      let visible = 0;
      grid.querySelectorAll(".tile").forEach(tile => {
        const matches = tile.dataset.norm.includes(q);
        tile.style.display = matches ? "" : "none";
        if(matches) visible++;
      });
      counterEl.textContent = visible;
      noResults.style.display = visible === 0 ? "block" : "none";
    });

  } else {
    document.getElementById("title").textContent = "Unrecognized region";
    document.getElementById("subtitle").textContent = "";
    grid.style.display = "none";
    empty.style.display = "block";
    empty.innerHTML = `This region isn't recognized. Go back to <a href="seleccionar-modo.html">choose mode</a>.`;
  }
</script>

</body>
</html>
