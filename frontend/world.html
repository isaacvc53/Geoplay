<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoPlay — Países del mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#012138; --panel:#013253; --ink:#c4946c; --muted:#93a7b4; --line:#254a63;
  --water:#012943; --land:#0a3550; --land-hover:#1c5578; --found:#5d3f26;
  --found-stroke:#c4946c; --accent:#c4946c; --accent-soft:#4a3320;
  --danger:#cfa272; --white:#f2ddc9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 12% 8%,rgba(1,50,83,.35),transparent 40%),radial-gradient(circle at 92% 92%,rgba(196,148,108,.10),transparent 45%);color:var(--ink);font-family:Inter,sans-serif}
.page{width:min(1320px,calc(100% - 28px));margin:24px auto 48px}
header{text-align:left;margin-bottom:16px}
.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700;color:var(--accent);margin:0 0 7px}
h1{font:700 42px/1.05 Fraunces,serif;margin:0 0 8px}
.subtitle{margin:0;color:var(--muted);font-size:14px}
.game{background:var(--panel);border:1px solid #0f4a6e;border-radius:10px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.14)}
.toolbar{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.progress{font:700 19px Fraunces,serif;min-width:150px}.progress span{color:var(--accent)}
.input-wrap{display:flex;gap:8px;flex:1;min-width:260px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:500 15px Inter,sans-serif}
input::placeholder{color:#5f7383}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{border:0;border-radius:6px;padding:11px 14px;font:700 13px Inter,sans-serif;cursor:pointer;background:var(--accent);color:var(--bg)}
button:hover{background:#d9b48c}
button.secondary{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.secondary:hover{background:var(--panel);color:var(--ink);border-color:var(--unsolved-line)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;min-width:78px;text-align:center}
.timer.paused{color:var(--danger)}
.map-area{position:relative;background:var(--water);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#map{width:100%;height:min(68vh,700px);min-height:430px;display:block;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.country{fill:var(--land);stroke:var(--unsolved-line);stroke-width:.55;vector-effect:non-scaling-stroke;transition:fill .15s ease,stroke .15s ease}
.country:hover{fill:var(--land-hover);stroke:var(--accent)}
.country.found{fill:var(--found);stroke:var(--found-stroke)}
.country.revealed-missing{fill:var(--land-hover);stroke:var(--accent-2)}
.country.unplayable{fill:#08283d;stroke:#123d57;opacity:.58}
.small-marker{fill:var(--land);stroke:var(--unsolved-line);stroke-width:1.1;pointer-events:none}
.small-marker.found{fill:var(--found);stroke:var(--found-stroke)}
.small-marker.revealed-missing{fill:var(--land-hover);stroke:var(--accent-2)}
.map-tools{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.map-tools button{padding:8px 10px;background:rgba(1,50,83,.94);color:var(--ink);border:1px solid var(--line)}
.hint{position:absolute;right:12px;bottom:12px;background:rgba(1,23,38,.90);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:11px;color:var(--muted)}
.feedback{min-height:20px;padding:9px 14px 0;font-size:13px;color:var(--muted)}
.feedback.ok{color:var(--found-stroke);font-weight:700}.feedback.no{color:var(--danger);font-weight:700}
.bottom{padding:11px 14px 15px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--line);flex-wrap:wrap}
.left-actions,.right-actions{display:flex;gap:8px;flex-wrap:wrap}
.found-list-wrap{padding:0 14px 15px;display:none}.found-list-wrap.open{display:block;border-top:1px solid var(--line);padding-top:10px}.found-list{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;font-weight:600;background:var(--accent-soft);border:1px solid transparent;padding:4px 10px;border-radius:999px;color:var(--found-stroke)}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(1,23,38,.94);color:var(--ink);padding:8px 12px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.show{opacity:1}
@media(max-width:720px){h1{font-size:34px}.page{width:min(100% - 14px,1320px);margin-top:12px}.toolbar{padding:10px}.input-wrap{min-width:100%}.progress{min-width:unset}#map{height:58vh;min-height:360px}.hint{display:none}}

<body>
<div class="page">
  <header>
    <p class="kicker">GeoPlay · Mundo</p>
    <h1>¿Cuántos países puedes nombrar?</h1>
    <p class="subtitle">Escribe países y el mapa se irá rellenando. Español o inglés · sin tildes · sin importar mayúsculas.</p>
  </header>

  <section class="game">
    <div class="toolbar">
      <div class="progress"><span id="count">0</span> / <span id="total">196</span></div>
      <div class="input-wrap">
        <input id="guess" type="text" placeholder="Escribe un país…" autocomplete="off" autofocus>
        <button id="submit">Comprobar</button>
      </div>
      <div id="timer" class="timer">15:00</div>
      <button id="pause" class="secondary" type="button">Pausa</button>
    </div>

    <div class="map-area" id="map-area">
      <svg id="map" viewBox="0 0 1200 650" aria-label="Mapa mundial"></svg>
      <div class="map-tools">
        <button id="zoom-in" type="button">＋</button>
        <button id="zoom-out" type="button">−</button>
        <button id="reset-view" type="button">↺</button>
      </div>
      <div class="hint">Arrastra el mapa · rueda para ampliar</div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="bottom">
      <div class="left-actions">
        <button id="missing" class="secondary" type="button">Mis países</button>
        <button id="give-up" class="secondary" type="button">Rendirme</button>
      </div>
      <div class="right-actions">
        <button id="reset" class="secondary" type="button">Reiniciar</button>
      </div>
    </div>
    <div class="found-list-wrap" id="found-list-wrap"><div class="found-list" id="found-list"></div></div>
  </section>
</div>

function normalizar(text){
  return (text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’'.,()_/\-]+/g,' ').replace(/\s+/g,' ').trim();
}
function fmtTime(sec){const m=String(Math.floor(sec/60)).padStart(2,'0');const s=String(sec%60).padStart(2,'0');return m+':'+s}
function setFeedback(msg,type=''){feedbackEl.textContent=msg;feedbackEl.className='feedback '+type}
function showToast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1200)}
function updateCount(){countEl.textContent=solved.size; if(solved.size===regions.length && regions.length){endQuiz('¡Has completado los 196 países! 🌍','ok')}}
function revealMissingOnMap(){regions.forEach(r=>{const el=featureByRegion.get(r.id);if(el)el.classed('revealed-missing',!solved.has(r.id));});document.querySelector('.hint').textContent='Pasa el ratón por un país para ver su nombre';}
function startTimer(){
  if(timerHandle || quizEnded) return;
  timerHandle=setInterval(()=>{
    if(paused) return;
    secondsLeft--; timerEl.textContent=fmtTime(secondsLeft);
    if(secondsLeft<=0){secondsLeft=0;timerEl.textContent='00:00';endQuiz('Se acabó el tiempo.','no')}
  },1000)
}
function endQuiz(message,type){quizEnded=true;if(timerHandle)clearInterval(timerHandle);timerHandle=null;guessEl.disabled=true;document.getElementById('submit').disabled=true;setFeedback(message,type);revealMissingOnMap()}
function resetQuiz(){
  solved.clear(); secondsLeft=QUIZ_SECONDS; paused=false; quizEnded=false; timerEl.textContent='15:00';timerEl.classList.remove('paused');pauseBtn.textContent='Pausa';
  if(timerHandle)clearInterval(timerHandle);timerHandle=null;guessEl.disabled=false;document.getElementById('submit').disabled=false;listWrap.classList.remove('open');setFeedback('');
  svg.selectAll('.country,.small-marker').classed('found',false).classed('revealed-missing',false);document.querySelector('.hint').textContent='Rueda para ampliar · arrastra para mover';hideMapTooltip();updateFoundList();updateCount();guessEl.value='';guessEl.focus();
}
function startOnFirstInput(){startTimer()}
function regionNames(region){return Array.isArray(region.names)?region.names:[]}
function findLocalGuess(raw){
  const q=normalizar(raw); if(!q) return null;
  let exact=regions.filter(r=>regionNames(r).some(n=>normalizar(n)===q));
  if(exact.length===1)return exact[0];
  const qTokens=q.split(' ').filter(Boolean); if(qTokens.some(t=>t.length<3))return null;
  const hits=regions.filter(r=>regionNames(r).some(name=>{
    const tokens=normalizar(name).split(' ');
    return qTokens.every(qt=>tokens.some(t=>t===qt||t.startsWith(qt)));
  }));
  return hits.length===1?hits[0]:null;
}
function atlasKey(name){
  const n=normalizar(name);
  const aliases={
    'united states of america':'united states', 'united states':'united states',
    'democratic republic of the congo':'democratic republic of the congo',
    'democratic republic of congo':'democratic republic of the congo',
    'dr congo':'democratic republic of the congo', 'drc':'democratic republic of the congo',
    'dem rep congo':'democratic republic of the congo',
    'central african republic':'central african rep.', 'dominican republic':'dominican rep.',
    'solomon islands':'solomon is.', 'saint vincent and the grenadines':'st. vin. and gren.',
    'saint kitts and nevis':'st. kitts and nevis', 'marshall islands':'marshall is.',
    'federated states of micronesia':'micronesia', 'micronesia':'micronesia',
    'cape verde':'cabo verde', 'bosnia and herzegovina':'bosnia and herz.',
    'czech republic':'czechia', 'czechia':'czechia', 'eswatini':'eswatini', 'swaziland':'eswatini',
    'viet nam':'vietnam', 'russian federation':'russia', 'brunei darussalam':'brunei',
    "lao people's democratic republic":'laos', 'lao pdr':'laos', 'e swatini':'eswatini',
    'south sudan':'s. sudan', 'republic of the congo':'congo', 'republic of congo':'congo',
    'vatican city':'vatican', 'holy see':'vatican', 'taiwan':'taiwan', 'kosovo':'kosovo',
    'north macedonia':'macedonia', 'macedonia':'macedonia'
  };
  return aliases[n]||n;
}

function numericGeoKey(v){
  const raw=String(v ?? '').trim();
  return raw ? raw.padStart(3,'0') : '';
}
function rebuildGeoIndex(){
  regionByGeoId.clear();
  regions.forEach(r=>regionNames(r).forEach(n=>{const id=GEO_ID_BY_NAME[normalizar(n)]; if(id) regionByGeoId.set(id,r);}));
}
function featureRegion(d,index){
  const id=numericGeoKey(d?.id);
  return (id && regionByGeoId.get(id)) || index.get(atlasKey(d?.properties?.name||'')) || null;
}
function buildFeatureIndex(){
  featureByRegion.clear();
  const index=new Map();
  regions.forEach(r=>regionKeySet(r).forEach(k=>index.set(k,r)));
  svg.selectAll('.country').each(function(d){
    const region=featureRegion(d,index);
    if(region){
      featureByRegion.set(region.id,d3.select(this));
      d3.select(this).classed('unplayable',false).attr('data-region-id',region.id);
    }
  });
}
function renderMap(){
  const width=1200,height=650;
  svg.attr('viewBox',`0 0 ${width} ${height}`);svg.selectAll('*').remove();
  projection=d3.geoNaturalEarth1().fitExtent([[8,8],[width-8,height-8]],{type:'FeatureCollection',features});
  path=d3.geoPath(projection);
  svg.append('path').datum({type:'Sphere'}).attr('fill','var(--water)').attr('d',path);
  const index=new Map();regions.forEach(r=>regionKeySet(r).forEach(k=>index.set(k,r)));
  const countries=svg.append('g').attr('class','countries');
  countries.selectAll('path').data(features).join('path')
    .attr('class','country').attr('d',path)
    .each(function(d){const r=featureRegion(d,index);if(!r){d3.select(this).classed('unplayable',true);return;}featureByRegion.set(r.id,d3.select(this));d3.select(this).attr('data-region-id',r.id).classed('found',solved.has(r.id));})
    .on('click',()=>{})
    .on('mouseenter',function(e,d){if(!quizEnded)return;const r=featureRegion(d,index);if(r)showMapTooltip(r,e);})
    .on('mousemove',function(e){if(quizEnded)moveMapTooltip(e);})
    .on('mouseleave',hideMapTooltip);
  buildFeatureIndex();
  const zoom=d3.zoom().scaleExtent([1,5]).translateExtent([[0,0],[width,height]]).extent([[0,0],[width,height]])
    .on('zoom',e=>svg.selectAll('.countries').attr('transform',e.transform));
  svg.call(zoom);window.currentZoom=zoom;
  document.getElementById('zoom-in').onclick=()=>svg.transition().duration(180).call(zoom.scaleBy,1.45);
  document.getElementById('zoom-out').onclick=()=>svg.transition().duration(180).call(zoom.scaleBy,1/1.45);
  document.getElementById('reset-view').onclick=()=>svg.transition().duration(220).call(zoom.transform,d3.zoomIdentity);

function addSolved(region){
  if(!region || solved.has(region.id))return;
  solved.add(region.id);const el=featureByRegion.get(region.id);if(el)el.classed('found',true).classed('revealed-missing',false);updateFoundList();updateCount();showToast('✓ '+(region.names?.[0]||'Correcto'));setFeedback('¡Correcto! '+(region.names?.[0]||''),'ok');guessEl.value='';guessEl.focus();
}
async function loadRegions(){
  try{
    const res=await fetch(`${API_BASE}/countries/${encodeURIComponent(WORLD_COUNTRY)}/regions/names`);if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();regions=data.map((r,i)=>({id:r.region_id,names:r.names||[],displayName:(r.names||[])[0]||`País ${i+1}`}));localMode=false;
  }catch(err){console.warn('Backend no disponible, usando lista local',err);localMode=true;regions=getLocalRegions();}
}

async function submitGuess(){
  if(quizEnded || paused)return;
  const raw=guessEl.value.trim();if(!raw)return;startOnFirstInput();let region=null;
  if(localMode) region=findLocalGuess(raw);
  else {
    try{const res=await fetch(`${API_BASE}/regions/check?country=${encodeURIComponent(WORLD_COUNTRY)}&name=${encodeURIComponent(raw)}`);if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(data.encontrado)region=regions.find(r=>r.id===data.region_id)||null}
    catch(err){localMode=true;region=findLocalGuess(raw)}
  }
  if(!region){setFeedback('No encontrado o nombre ambiguo.','no');guessEl.select();return}
  if(solved.has(region.id)){setFeedback('Ese país ya está descubierto.');guessEl.select();return}
  addSolved(region);
}
function updateFoundList(){
  const wrap=document.getElementById('found-list-wrap');const list=document.getElementById('found-list');
  if(!wrap||!list)return;
  const found=regions.filter(r=>solved.has(r.id)).sort((a,b)=>a.displayName.localeCompare(b.displayName,'es'));
  list.innerHTML=found.map(r=>`<span class="chip">${r.displayName}</span>`).join('');
}
function toggleFoundList(){
  const wrap=document.getElementById('found-list-wrap');
  if(!solved.size){setFeedback('Todavía no has acertado ningún país.');return;}
  updateFoundList();wrap.classList.toggle('open');
}
pauseBtn.onclick=()=>{if(quizEnded)return;paused=!paused;timerEl.classList.toggle('paused',paused);pauseBtn.textContent=paused?'Reanudar':'Pausa';setFeedback(paused?'El quiz está pausado.':'');if(paused)guessEl.blur();else guessEl.focus()};
document.getElementById('submit').onclick=submitGuess;
document.getElementById('missing').onclick=toggleFoundList;
document.getElementById('give-up').onclick=()=>{if(quizEnded)return;endQuiz(`Quiz terminado: ${solved.size}/${regions.length}. Los países que faltaban están resaltados; pasa el ratón para ver sus nombres.`, 'no')};
document.getElementById('reset').onclick=resetQuiz;
guessEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitGuess()}});

async function bootstrap(){
  const topo=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');
  features=topojson.feature(topo,topo.objects.countries).features.filter(f=>f.properties?.name);
  await loadRegions();
  // Si la carga del backend falla, la lista local tiene 196 entradas jugables.
  if(regions.length!==TOTAL){console.warn('Se esperaban 196 regiones, se recibieron',regions.length)}
  rebuildGeoIndex(); renderMap(); updateCount(); startTimer();
  setFeedback(localMode?'Mapa listo en modo local.':'Mapa listo.');
}
bootstrap().catch(err=>{console.error(err);setFeedback('No se pudo cargar el mapa mundial. Comprueba la conexión.','no')});
