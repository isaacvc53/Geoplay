server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/;   # la barra final quita el prefijo /api
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El index no se cachea, así tras cada build nuevo se cargan los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: /perfil, /pais, /modo... no son archivos, los resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
