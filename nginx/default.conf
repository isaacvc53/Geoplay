# --- Límite de intentos en login/registro (por IP) ---
# Solo /api/auth/login y /api/auth/register tienen clave; el resto de rutas
# tiene clave vacía y nginx no las limita.
# NOTA: si algún día pones un proxy delante (Caddy, Cloudflare Tunnel...), todas
# las peticiones llegarán con la IP de ese proxy: habría que configurar
# real_ip (set_real_ip_from + real_ip_header) para que el límite siga siendo por usuario.
# (Se usa $request_uri y no $uri: más abajo el rewrite cambia $uri a /auth/login.)
map $request_uri $auth_limit_key {
    ~^/api/auth/(login|register)/?(\?.*)?$  $binary_remote_addr;
    default                                  "";
}
limit_req_zone $auth_limit_key zone=auth_zone:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compresión (viene desactivada por defecto) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # --- Cabeceras de seguridad ---
    # (Sin add_header dentro de los location: si lo hubiera, nginx dejaría de
    # heredar estas. Por eso la caché se define con "expires".)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Resolver DNS interno de Docker: nginx vuelve a resolver "backend" cada pocos
    # segundos, así que si recreas el contenedor del backend no da 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        limit_req zone=auth_zone burst=5 nodelay;

        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;   # quita el prefijo /api
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El index no se cachea, así tras cada build nuevo se cargan los assets nuevos.
    location = /index.html {
        expires -1;
    }

    # Assets de Vite: el nombre lleva hash (index-CgbuOFIg.js), cambia en cada build,
    # así que se pueden cachear un año. Si no existe -> 404 real (no el index.html).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Datos de países y mapas: se revalidan con ETag (304 si no han cambiado),
    # así no hace falta el ?v=Date.now() y no se descargan de nuevo en cada partida.
    # Si un archivo no existe -> 404 real, no HTML.
    location /data/ {
        try_files $uri =404;
        expires -1;
    }

    # Nunca servir archivos ocultos (.env, .git...)
    location ~ /\. {
        deny all;
    }

    # SPA: /perfil, /pais, /modo... no son archivos, los resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
